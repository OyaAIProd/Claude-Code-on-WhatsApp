<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Peta Lokasi & Titik</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; }
    #map { height: 100vh; width: 100%; }
    #panel { position: absolute; top: 10px; right: 10px; z-index: 1000; background: #fff; padding: 10px 12px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.25); font-size: 13px; max-width: 240px; }
    #panel h3 { margin: 0 0 6px; font-size: 14px; }
    .row { margin: 4px 0; }
    button { cursor: pointer; border: 0; background: #2563eb; color: #fff; padding: 5px 9px; border-radius: 5px; font-size: 12px; }
    .muted { color: #666; font-size: 11px; }
    .legend span { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="panel">
    <h3>🗺️ Peta Lokasi</h3>
    <div class="row legend"><span style="background:#16a34a"></span>live aktif <span style="background:#9ca3af"></span>expired/pin</div>
    <div class="row legend"><span style="background:#dc2626"></span>titik (waypoint)</div>
    <div class="row"><button onclick="load()">🔄 Refresh</button> <span class="muted" id="stat"></span></div>
    <div class="row muted">Klik di peta untuk tambah titik bernama.</div>
  </div>
  <script>
    const map = L.map('map').setView([-0.5, 103.2], 9);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19, attribution: '© OpenStreetMap'
    }).addTo(map);

    let layer = L.layerGroup().addTo(map);

    async function load() {
      try {
        const r = await fetch('/api/map');
        if (!r.ok) { document.getElementById('stat').textContent = 'auth/err ' + r.status; return; }
        const d = await r.json();
        layer.clearLayers();
        let bounds = [];
        const palette = ['#7c3aed', '#0891b2', '#ea580c', '#0d9488'];
        (d.routes || []).forEach((rt, ri) => {
          const pts = (rt.stops || []).map(s => [s.lat, s.lng]);
          if (pts.length >= 2) {
            L.polyline(pts, { color: palette[ri % palette.length], weight: 4, opacity: .7, dashArray: '6,6' })
              .bindPopup('🧭 <b>' + rt.name + '</b><br>' + rt.stops.map((s, i) => (i + 1) + '. ' + s.name).join('<br>'))
              .addTo(layer);
            pts.forEach(p => bounds.push(p));
          }
        });
        (d.waypoints || []).forEach((w, i) => {
          const rkm = w.radius_km || 1;
          // radius circle
          L.circle([w.lat, w.lng], { radius: rkm * 1000, color: '#dc2626', weight: 1, fillColor: '#dc2626', fillOpacity: .08 }).addTo(layer);
          // draggable center marker
          const mk = L.marker([w.lat, w.lng], { draggable: true, title: w.name }).addTo(layer);
          mk.bindPopup('📍 <b>' + w.name + '</b><br>radius: <input id="r' + i + '" value="' + rkm + '" style="width:48px"> km '
            + '<button onclick="setR(' + i + ',\'' + esc(w.name) + '\',' + w.lat + ',' + w.lng + ')">set</button>'
            + '<br><small>' + w.lat.toFixed(5) + ', ' + w.lng.toFixed(5) + ' — geser marker untuk pindah</small>'
            + '<br><button onclick="delWp(\'' + esc(w.name) + '\')">hapus</button>');
          mk.on('dragend', async (e) => {
            const ll = e.target.getLatLng();
            await fetch('/api/waypoint', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: w.name, lat: ll.lat, lng: ll.lng }) });
            load();
          });
          bounds.push([w.lat, w.lng]);
        });
        (d.locations || []).forEach(l => {
          const col = (l.is_live && !l.expired) ? '#16a34a' : '#9ca3af';
          const when = new Date(l.ts * 1000).toLocaleString('id-ID', { timeZone: 'Asia/Jakarta' });
          L.circleMarker([l.lat, l.lng], { radius: 7, color: col, fillColor: col, fillOpacity: .85 })
            .bindPopup('👤 <b>' + (l.sender || '?') + '</b><br>' + (l.is_live ? (l.expired ? 'live (expired)' : 'live aktif') : 'pin') + '<br>' + when + '<br>' + l.lat.toFixed(5) + ', ' + l.lng.toFixed(5))
            .addTo(layer);
          bounds.push([l.lat, l.lng]);
        });
        document.getElementById('stat').textContent = (d.locations || []).length + ' lokasi · ' + (d.waypoints || []).length + ' titik';
        if (bounds.length) map.fitBounds(bounds, { padding: [40, 40], maxZoom: 13 });
      } catch (e) { document.getElementById('stat').textContent = 'err'; }
    }

    map.on('click', async (e) => {
      const name = prompt('Nama titik di ' + e.latlng.lat.toFixed(5) + ', ' + e.latlng.lng.toFixed(5) + ' :');
      if (!name) return;
      await fetch('/api/waypoint', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, lat: e.latlng.lat, lng: e.latlng.lng }) });
      load();
    });

    function esc(s) { return String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'"); }
    async function delWp(name) {
      if (!confirm('Hapus titik "' + name + '"?')) return;
      await fetch('/api/waypoint/delete', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name }) });
      load();
    }
    async function setR(i, name, lat, lng) {
      const v = parseFloat(document.getElementById('r' + i).value);
      if (!isFinite(v) || v <= 0) { alert('radius km invalid'); return; }
      await fetch('/api/waypoint', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, lat, lng, radius: v }) });
      load();
    }
    window.delWp = delWp; window.setR = setR;

    load();
    setInterval(load, 20000);
  </script>
</body>
</html>
